<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda Store - براند البراويز الفاخرة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

    <header>
        <div class="header-container">
            <h1>Boda Store 🖼️</h1>
           <button id="theme-toggle" class="theme-btn">🔅</button>
        </div>
        <p>أرقى البراويز والبوسترات لمساحتك الخاصة</p>
    </header>

    <main>
        <h2>أحدث البراويز</h2>
        <div class="products-grid">
            
            <!-- برواز 1 -->
            <div class="product-card">
                <img src="images/frame1.jpg" alt="برواز BMW M4 G82">
                <h3>برواز BMW M4 G82</h3>
                <p>طباعة Glossy فاخرة - مقاس A3</p>
                <span class="price">250 ج.م</span>
                <a href="https://wa.me/201069647553" class="buy-btn">طلب عبر الواتساب</a>
            </div>

            <!-- برواز 2 -->
            <div class="product-card">
                <img src="images/frame2.jpg" alt="Messi Poster">
                <h3>Lionel Messi Frame</h3>
                <p>طباعة Glossy فاخرة - مقاس A3</p>
                <span class="price">250 ج.م</span>
                <a href="https://wa.me/201069647553" class="buy-btn">طلب عبر الواتساب</a>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
